# 设计与界面规则的唯一事实来源。
# 本文件已按 ColorPoetry 产品品牌定制：从 src/styles/global.css 的既有实现反向提炼，
# 作为该实现的规范记录；后续界面改动先改本文件，再同步 global.css，最后改界面。
# status 为「已定制」后 use-ai-rule 重新生成不再覆盖本文件；结构契约与定制流程见界面子规则的设计系统小节
# 该文件面向人和 AI 共同使用：可读、可解析、非可执行、易于比对。
# 适用范围：ColorPoetry（Astro 静态内容站，无表单、无后端）。

meta:
  name: "ColorPoetry 中国传统颜色设计系统"
  version: "1.0.0"
  status: "已定制"
  owners:
    - "azrng"
  tech_stack:
    framework: "Astro 5（静态内容站，Astro 组件 + 原生 CSS + 原生 TS 脚本）"
    styling: "单一 global.css，语义 token 以 CSS 自定义属性（--paper/--ink/--accent 等）表达"
    typography: "标题衬线（宋体系），正文无衬线（苹方/雅黑系）"
    icons: "文字符号（×、‹、›、色字方标），无图标库"
    forms: "仅搜索输入框，无表单校验体系"
    state: "无全局状态；局部交互用原生 DOM 事件委托"

  usage:
    read_order:
      - "先阅读 AGENTS.md，按根规则命中前端子规则"
      - "命中 frontend-AGENTS.md 后再阅读本文件"
      - "然后查看 src/styles/global.css 与 src/layouts/Base.astro"
    principles:
      - "当前颜色是整站唯一强调色：每个颜色页在 <html> 注入 --accent，其余色阶全部用 color-mix 现场调出"
      - "优先复用已有布局、组件和 token，不引入平行视觉体系"
      - "动效克制：只保留底色流动、卡片悬浮与抽屉滑入三类"

product:
  style_keywords:
    - "东方编辑风"
    - "宣纸质感"
    - "克制"
    - "诗意"
    - "内容优先"
  ui_goal:
    - "一色一诗一源一物：阅读体验优先，界面退后"
    - "当前颜色染整站底色，切换颜色时底色随之流动"
    - "移动端（≤900px）为抽屉式导航：内容第一时间可见，色系列表收进抽屉"

tokens:
  colors:
    # 基底色（固定）
    paper: "#f4f1ea"      # 宣纸底色
    ink: "#2b2721"        # 主文字/近墨色
    ink-soft: "#6f695f"   # 次级文字/弱化信息
    shade: "#221d15"      # 调 deep 用的暗基色
    accent-default: "#97907f" # 首页等未注入 --accent 时的默认强调色
    # 强调色 --accent 为动态 token：由每个颜色页注入当前颜色的 HEX，
    # 以下派生色全部经 color-mix(in oklab) 现场调出，禁止写成固定值：
    #   bg   = accent 10% + paper      （整站页面底色）
    #   side = accent 20% + paper      （侧栏/顶栏底色）
    #   deep = accent 40% + shade      （深强调：大标题、kicker、h2）
    #   line = accent 38% + transparent（边框、分隔线）

  semantic:
    text:
      primary: "ink（--ink）"
      secondary: "ink-soft（--ink-soft）"
      on_deep: "paper（--paper，用于 deep 底上的文字，如品牌方标）"
      on_swatch: "运行时按 HEX 亮度计算（lib/color.ts textColorOn）"
      link: "deep（--deep）"
    background:
      page: "bg（--bg，accent 10% 混宣纸）"
      panel: "side（--side，accent 20% 混宣纸）"
      raised: "#ffffff 或 accent 低比例混白（搜索框）"
      brand: "deep（--deep，品牌方标底色）"
    border:
      default: "line（--line，accent 38% 透明）"
      swatch_inner: "rgb(0 0 0 / 0.08) 内描边（色块、色卡统一）"

  typography:
    font_family:
      serif: "Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif SC', 'Source Han Serif SC', SimSun, serif（品牌方标、大标题、h2/h4、颜色名）"
      sans: "-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', sans-serif（正文与界面文字）"
    font_size:
      display: "clamp(3rem, 7vw, 4.4rem)（颜色页 H1）；clamp(3rem, 8vw, 5rem)（首页 H1）；移动端降档见 responsive"
      h2: "1.7rem"
      h4: "1.3rem"
      base: "16px"
      tile_name: "1.02rem"
      color_name: "1.12rem"
      kicker_label: "0.68rem–0.72rem + 0.2em 以上字距（kicker、分组名、方向词）"
      hexcode: "0.68rem–0.85rem + tabular-nums"
    font_weight:
      display: 700
      heading: 600
      body: 400
    line_height:
      body: "1.8（界面）/ 2.05（正文段落）"
      display: 1.15

  spacing:
    base_unit: "4px（实现以 rem 为主：侧栏内边距 1.8rem/1.4rem，文章页 4.5rem 3rem 5rem，首页 cover 上下 min(10vh,5.5rem)、左右 2rem）"

  radius:
    sm: "8px（色块 .sw、输入框、按钮）"
    md: "12px（图片、面板、色卡 .tile-swatch、色条 .swatch-band）"

  shadow:
    swatch_inner: "inset 0 0 0 1px rgb(0 0 0 / 0.08)（所有色块的统一内描边）"
    tile_hover: "0 10px 26px color-mix(in oklab, var(--c) 45%, transparent)"
    lightbox: "0 24px 80px rgb(0 0 0 / 0.5)"

  textures:
    paper_grain: "--grain：SVG feTurbulence 灰度噪点（160px 平铺、透明度 0.04），叠于 body、侧栏与移动端顶栏底色上，压住大面积纯色的平板感"

  transitions:
    site_tint: "background-color 0.7s ease（body 与侧栏底色流动）"
    interaction: "0.25s ease（列表项、chips、灯箱按钮）"
    tile_lift: "transform 0.3s cubic-bezier(0.16, 1, 0.3, 1)"
    drawer: "transform 0.3s ease（移动端抽屉）"

  breakpoints:
    mobile: "900px（≤900px 启用移动端布局：抽屉导航、单列、紧凑间距）"

state_management:
  local_state:
    tool: "原生 DOM 事件委托（document 级 input/click 监听，视图过渡后依然有效）"
    use_for:
      - "侧栏/首页搜索过滤"
      - "移动端抽屉开关"
      - "图片灯箱开关与翻页"
  global_state:
    tool: "无（纯静态站，无客户端全局状态）"
  server_state:
    default_pattern: "无后端；内容来自 contents/ 目录的 markdown 集合，构建期渲染"

page_states:
  required:
    - "empty（搜索无结果：『没有匹配的颜色』提示）"
  guidance:
    empty: "搜索无匹配时在列表位置显示提示文案，清空关键词即恢复"
  not_applicable:
    - "loading / error / not-found / no-permission：构建期静态渲染，无运行时取数"

component_rules:
  reuse_first: true
  file_placement:
    pages: "src/pages（index.astro 首页、color/[slug].astro 颜色详情、404.astro 此色未录）"
    components: "src/components（Sidebar.astro 侧栏/移动端顶栏与抽屉）"
    layouts: "src/layouts/Base.astro（head、强调色注入、图片灯箱）"
    lib: "src/lib/color.ts（分组、色系判断、文字对比色）"
  rules:
    - "灯箱、搜索过滤等脚本统一用 document 级事件委托，兼容 astro:transitions 视图过渡"
    - "不引入 UI 框架、图标库或样式库"

form_rules:
  not_applicable: "本项目无表单；唯一输入是搜索框，回车清空、即时过滤"

responsive:
  principle: "移动优先（实现文件 global.css 为既有桌面优先结构，增量改动跟随文件现有约定，写入 ≤900px 媒体查询）"
  common_patterns:
    page_padding: "移动端文章页 2.8rem 1.3rem 4rem；首页 cover 收紧至 1.1rem 左右边距"
    grid: "色卡墙 auto-fill minmax(124px, 1fr) 全端自适应，移动端自然两列"
    sidebar: "桌面 ≥901px 固定 300px 侧栏；移动端 ≤900px 抽屉式导航（顶栏 + 左滑抽屉）"
    pager: "移动端上一色/下一色纵向堆叠"
  rules:
    - "关键操作不依赖 hover：列表项、色卡、灯箱均有 :active 反馈与点按路径"
    - "灯箱支持触摸左右滑动切图（桌面保留方向键与箭头按钮）"
    - "内容图片统一 loading=lazy + decoding=async"

do:
  - "先改本文件 token，再同步 global.css，最后改界面"
  - "新色阶一律用 color-mix 从 --accent 现场派生，不写死色值"
  - "桌面端与移动端都进行基本可用性检查（375px / 320px / ≥901px）"

dont:
  - "不引入 UI 框架、图标库、Tailwind 等新样式体系"
  - "不在界面里硬编码断点（统一 900px）或写死强调色"
  - "不让移动端内容被导航压到首屏之下"
